<!doctype html><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:Impact,"Arial Black",sans-serif;position:relative;
background:repeating-conic-gradient(from 0deg at 62% 58%,#ff8a1f 0 7.5deg,#c2410c 7.5deg 15deg)}
.o{color:#fff;-webkit-text-stroke:12px #111;paint-order:stroke fill;text-transform:uppercase;line-height:.98}
.y{color:#fcc419}
.top{position:absolute;left:60px;top:60px;background:#111;color:#fcc419;font-size:44px;padding:10px 28px;border-radius:14px;transform:rotate(-2deg);letter-spacing:1px}
h1{position:absolute;left:60px;top:170px;font-size:128px;font-weight:400;width:620px}
h1 span{display:block}
.toy{position:absolute;right:-60px;bottom:200px;height:800px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.45))}
.tag{position:absolute;left:60px;top:640px;width:560px;font-size:56px;font-weight:400;-webkit-text-stroke:9px #111}
.chips{position:absolute;left:60px;top:960px;display:flex;flex-direction:column;gap:14px}
.chips div{background:#111;color:#fff;font-size:38px;padding:10px 26px;border-radius:14px;width:max-content;transform:rotate(-2deg);letter-spacing:1px}
.chips div:nth-child(2){transform:rotate(1.5deg)}
.cta{position:absolute;left:0;right:0;bottom:0;height:190px;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.cta b{background:#fcc419;color:#111;font-size:58px;font-weight:400;padding:6px 40px;border-radius:18px;letter-spacing:1px}
.cta i{color:#fff;font-style:normal;font-size:36px;letter-spacing:2px}
</style>
<div class="top">📍 VECINOS DE EL REDIL</div>
<h1 class="o"><span>Prueba</span><span class="y">Nine to</span><span class="y">Thief</span></h1>

<div class="chips"><div>🎮 GRATIS, EN EL CELULAR</div><div>💬 TU OPINIÓN NOS AYUDA</div></div>
<img class="toy" src="../public/toy.webp">
<div class="cta"><b>JUEGA Y DANOS TU FEEDBACK</b><i>NINE-TO-THIEF.VERCEL.APP</i></div>
